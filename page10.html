<!doctype html>
<html lang="ru">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<title>Игра со смайликом</title>

	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%98%80%3C/text%3E%3C/svg%3E" />
	<link href="page10.css" rel="stylesheet" type="text/css" />

	<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Neucha&display=swap" rel="stylesheet">
</head>

<body>

	<div class="snowflakes" aria-hidden="true">
		<div class="snowflake">❄</div>
		<div class="snowflake">❄</div>
		<div class="snowflake">❄</div>
		<div class="snowflake">❄</div>
		<div class="snowflake">❄</div>
		<div class="snowflake">❄</div>
	</div>

	<div id="container">

		<section id="welcome">
			<h1 class="center">Смайлик</h1>
			<h2 class="center">Здесь будет игра на JS.</h2>
		</section>

		<section id="game">

			<div class="paper">
				<div class="paperborder">

					<h3 class="center">Игровое поле</h3>

					<div class="smiley" role="img" aria-label="Смайлик">
						<div class="eye left"></div>
						<div class="eye right"></div>
						<div class="cheek left"></div>
						<div class="cheek right"></div>
						<div class="mouth"></div>
					</div>

					<p class="soon center">Тут будет игра на JS. Кнопки пока не работают.</p>

					<div class="buttons">
						<button type="button" disabled>Улыбнуться</button>
						<button type="button" disabled>Моргнуть</button>
						<button type="button" disabled>Удивиться</button>
						<button type="button" disabled>Грустить</button>
						<button type="button" disabled>Сначала</button>
					</div>

					<p class="note"><em>Все кнопки отключены намеренно.</em></p>

					<p class="next"><a href="index.html">Вернуться на главную</a></p>

				</div>
			</div>

		</section>

		<section id="goodbye">
			<p class="center">&copy; 2026 МКСК. Все права на смайлики защищены.</p>
		</section>

	</div>

</body>

</html>
